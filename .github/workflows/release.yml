name: Release Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # Trigger on version tags like 1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build project
        run: cargo build --release

      - name: Generate third-party licenses
        run: |
          cargo install cargo-about --features="cli" --locked
          python scripts/licenses.py

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/scripts | Out-Null

          # Copy over files from the build and the repo
          Copy-Item target/release/final_fantasy_resonance_fix.dll package/scripts/final_fantasy_resonance_fix.asi
          Copy-Item final_fantasy_resonance_fix.toml package/scripts/
          Copy-Item README.txt package/
          Copy-Item LICENSES package/

          # Download and checksum-verify Ultimate ASI Loader straight into the package
          python scripts/loader.py package

          Compress-Archive -Path package/* -DestinationPath "${{ github.event.repository.name }}_${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          files: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
